<!doctype html>
<html lang="es">
<head>

  <title>Habit Tracker</title>
  <meta name="description" content="Habit Tracker: control personal de hábitos diarios, tareas, nota del día, peso, sueño, metas y eventos del mes.">
  <meta name="theme-color" content="#fcf9f8">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>

    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-1.5.6-2.6 1.3-3.4.4 1 1.2 1.6 2.2 1.4C10.5 8 10 5.5 12 3z"/></symbol>

    <symbol id="i-feather" viewBox="0 0 24 24"><path d="M5 20c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 20c3-5 6-8 10-11"/></symbol>

    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg class="ic"><use href="#i-check-circle"/></svg></div>
        <div class="brand-name">Habit Tracker</div>
      </div>
      <p class="motto hand" data-motto></p>
      <nav class="nav" aria-label="Secciones">
        <a href="#/hoy" data-nav="hoy"><svg class="ic"><use href="#i-home"/></svg><span>Hoy</span></a>
        <a href="#/calendario" data-nav="calendario"><svg class="ic"><use href="#i-calendar"/></svg><span>Calendario</span></a>
        <a href="#/habitos" data-nav="habitos"><svg class="ic"><use href="#i-check-circle"/></svg><span>Hábitos</span></a>
        <a href="#/mensual" data-nav="mensual"><svg class="ic"><use href="#i-grid"/></svg><span>Mensual</span></a>
        <a href="#/estadisticas" data-nav="estadisticas"><svg class="ic"><use href="#i-chart"/></svg><span>Estadísticas</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost" data-install-shell hidden><svg class="ic"><use href="#i-download"/></svg><span>Instalar app</span></button>
        <a href="#/ajustes" data-nav="ajustes" class="nav-link"><svg class="ic"><use href="#i-settings"/></svg><span>Ajustes</span></a>
        <p class="sidebar-note"><svg class="ic"><use href="#i-feather"/></svg> Pequeños hábitos, grandes cambios.</p>
      </div>
    </aside>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#/hoy" data-nav="hoy"><svg class="ic"><use href="#i-home"/></svg><span>Hoy</span></a>
      <a href="#/calendario" data-nav="calendario"><svg class="ic"><use href="#i-calendar"/></svg><span>Calendario</span></a>
      <a href="#/habitos" data-nav="habitos"><svg class="ic"><use href="#i-check-circle"/></svg><span>Hábitos</span></a>
      <a href="#/mensual" data-nav="mensual"><svg class="ic"><use href="#i-grid"/></svg><span>Mensual</span></a>
      <a href="#/estadisticas" data-nav="estadisticas"><svg class="ic"><use href="#i-chart"/></svg><span>Stats</span></a>
      <a href="#/ajustes" data-nav="ajustes"><svg class="ic"><use href="#i-settings"/></svg><span>Ajustes</span></a>
    </nav>

  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
